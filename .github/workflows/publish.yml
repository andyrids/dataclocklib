# .github/workflows/publish.yml
# Trusted publishing (OIDC, no API token). One-time setup: add a PyPI
# "trusted publisher" for andyrids/dataclocklib, workflow publish.yml,
# environment "pypi", and create the "pypi" environment on GitHub.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false # never restore a cache into a release build

      # A dirty tree means something changed the sources; fail rather than
      # publish files that differ from the tagged commit
      - name: Check working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Pin the version to the tag, independent of git describe state
      - name: Pin version to tag
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DATACLOCKLIB=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      # Catches tags that are not normalised PEP 440 versions (e.g. v1.0-rc1)
      - name: Verify tag matches built version
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/dataclocklib-${TAG#v}-py3-none-any.whl"

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/dataclocklib/
    permissions:
      id-token: write # OIDC trusted publishing, no API token secret
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
